<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karol Joy | Creative Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <nav class="nav-container">
            <div class="logo">IM' <span class="pink-highlight">Karol</span></div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                
                <li class="dropdown">
                    <a href="#" class="dropbtn">About ▾</a>
                    <div class="dropdown-content">
                        <a href="#">Hobbies</a>
                        <a href="#">Goals</a>
                        <a href="#">Education</a>
                    </div>
                </li>

                <li><a href="#">Portfolio</a></li>

                <li class="dropdown">
                    <a href="#" class="dropbtn">Contact ▾</a>
                    <div class="dropdown-content">
                        <a href="https://linkedin.com" target="_blank">LinkedIn</a>
                        <a href="https://github.com" target="_blank">GitHub</a>
                        <a href="https://instagram.com" target="_blank">Instagram</a>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <div class="hero-content">
            <div class="greeting-container">
                <span class="moving-greet">Hello!</span>
                <span class="moving-greet">Ciao!</span>
                <span class="moving-greet">Hola!</span>
            </div>
            
            <h1>Im <span class="blue-glow">Karol Joy</span></h1>
            <p class="hero-sub">Digital Creator & Innovation Enthusiast</p>
        </div>

        <div class="interactive-container" id="frameTrigger">
            <div class="scroll-reveal">
                <img src="media/scroll-bg.png" alt="scroll" class="scroll-img">
                <div id="typewriter" class="typewriter-text"></div>
            </div>
            
            <div class="portrait-wrapper">
                <img src="media/space GIF.gif" alt="Karol Portrait" class="portrait">
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
