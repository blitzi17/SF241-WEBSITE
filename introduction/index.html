<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM' Karol - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <header class="nav-container">
        <div class="logo">IM' <span class="highlight">Karol</span></div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </header>

    <section id="home" class="hero">
        <div class="hero-content">
            <p class="accent-text">🚀 Constant Innovation</p>
            <h1>Creative Digital <span class="gradient-text">Innovation</span></h1>
            <p>I transform ideas into immersive digital realities.</p>
        </div>
        <div class="hero-image-container">
            <img src="../media/hero-placeholder.jpg" class="hero-img">
        </div>
    </section>

    <section id="portfolio" class="section-container">
        <h2>Featured <span class="gradient-text">Portfolio</span></h2>
        <div class="gallery-grid">
            
            <div class="gallery-item" onclick="openModal('../media/9428f962-9bb2-4913-be85-ec03ffb2a2fc.jpg', 'AI Brand Identity', 'This project focuses on neon-futuristic branding.')">
                <img src="../media/9428f962-9bb2-4913-be85-ec03ff_thumb.jpg" alt="Project 1">
                <div class="hover-overlay">
                    <h3>AI Brand Identity</h3>
                    <p>View Details</p>
                </div>
            </div>

            <div class="gallery-item" onclick="openModal('../media/09c40290-36c3-4c1a-9b96-ee1d882f0995.jpg', 'Cyber UI Design', 'Interactive dashboard with glassmorphism effects.')">
                <img src="../media/09c40290-36c3-4c1a-9b96-ee1d88_thumb.jpg" alt="Project 2">
                <div class="hover-overlay">
                    <h3>Cyber UI Design</h3>
                    <p>View Details</p>
                </div>
            </div>

        </div>
    </section>

    <div id="zoomModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" src="" class="modal-img">
            <div class="modal-text">
                <h2 id="modalTitle" class="gradient-text"></h2>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>

    <script src="../JS/main.js"></script>
</body>
</html>
