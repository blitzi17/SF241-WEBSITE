<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karol Joy | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <nav class="nav-container">
            <ul class="nav-links">
                <li><a href="#home">HOME</a></li>
                <li class="dropdown">
                    <a href="javascript:void(0)" class="dropbtn">ABOUT</a>
                    <ul class="dropdown-content">
                        <li><a href="#">HOBBIES</a></li>
                        <li><a href="#">GOALS</a></li>
                        <li><a href="#">EDUCATION</a></li>
                    </ul>
                </li>
                <li><a href="#">PROJECTS</a></li>
                <li><a href="#">GALLERY</a></li>
                <li class="dropdown">
                    <a href="javascript:void(0)" class="dropbtn">CONTACT</a>
                    <ul class="dropdown-content">
                        <li><a href="https://linkedin.com" target="_blank">LINKEDIN</a></li>
                        <li><a href="https://github.com" target="_blank">GITHUB</a></li>
                        <li><a href="https://instagram.com" target="_blank">INSTAGRAM</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

<main class="hero">
        <div class="main-display">
            <div class="interactive-wrapper" id="frameTrigger">
                <div class="scroll-area">
                    <div id="typewriter" class="ink-text"></div>
                </div>

                <div class="portrait-box">
                    <img src="../media/MAIN PIC.png" alt="Karol Joy" class="portrait-img">
                </div>
            </div>
        </div>
    </main>

    <section class="gallery-container">
        <div class="gallery-item" onclick="openModal('../media/your-image-1.jpg', 'Innovative Web Experience', 'Creating seamless user journeys using modern web technologies.')">
            <img src="../media/your-image-1.jpg" alt="Project 1">
            <div class="hover-overlay">
                <h3>Web Experience</h3>
                <p>View Details</p>
            </div>
        </div>

        <div class="gallery-item" onclick="openModal('../media/your-image-2.jpg', 'Visual Storytelling', 'Using AI and digital art to tell compelling brand stories.')">
            <img src="../media/your-image-2.jpg" alt="Project 2">
            <div class="hover-overlay">
                <h3>Visual Storytelling</h3>
                <p>View Details</p>
            </div>
        </div>

        <div class="gallery-item" onclick="openModal('../media/your-image-3.jpg', 'Queue Optimizer', 'A smart system designed to predict peak hours and suggest the best visit times.')">
            <img src="../media/your-image-3.jpg" alt="Project 3">
            <div class="hover-overlay">
                <h3>Queue Optimizer</h3>
                <p>View Details</p>
            </div>
        </div>
    </section>

    <div id="galleryModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" src="" alt="Gallery Image">
            <div class="modal-text">
                <h2 id="modalTitle"></h2>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>

    <script src="../JS/main.js"></script>
</body>
</html>
