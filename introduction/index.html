<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Website</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

<div id="app">

    <header>
        <div class="logo">My Name</div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
            </ul>
        </nav>
    </header>

    <!-- ABOUT -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>About Me</h1>
            <p>
                I am a passionate developer with interests in web technologies,
                design, and innovation.
            </p>
        </div>
        <div class="hero-photo">
            <img src="https://via.placeholder.com/300" alt="Professional Photo">
        </div>
    </section>

    <!-- PORTFOLIO -->
    <section id="portfolio" class="portfolio">
        <h2>Portfolio</h2>

        <div class="gallery">
            <div
                class="gallery-item"
                v-for="item in items"
                :key="item.id"
            >
                <img :src="item.src" :alt="item.title">
                <h3>{{ item.title }}</h3>
                <p>{{ item.description }}</p>
            </div>
        </div>
    </section>

    <!-- GUESTBOOK -->
    <section class="interactions">
        <h2>Guestbook</h2>

        <form @submit.prevent="addMessage" class="guestbook">
            <input
                v-model="newMessage.name"
                type="text"
                placeholder="Your Name"
                required
            >

            <select v-model="newMessage.rating" required>
                <option disabled value="">Rating</option>
                <option v-for="n in 5" :key="n" :value="n">
                    {{ n }}
                </option>
            </select>

            <textarea
                v-model="newMessage.message"
                placeholder="Your Message"
                required
            ></textarea>

            <button type="submit">Submit</button>
        </form>

        <div class="messages">
            <div class="message" v-for="msg in messages" :key="msg.id">
                <strong>{{ msg.name }}</strong>
                ({{ generateStars(msg.rating) }})
                <p>{{ msg.message }}</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 My Name</p>
    </footer>

</div>

<!-- Vue 3 -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="../JS/main.js" defer></script>

</body>
</html>
